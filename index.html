<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Invitation</title>

<style>
body {
  font-family: Arial, sans-serif;
  background-image: url('da.jpeg');
  background-size: cover;
  background-position: center;
  color: white;
  text-align: center;
  margin: 0;
}

.card {
  background: rgba(0, 0, 0, 0.6);
  padding: 25px;
  margin: 80px auto;
  width: 320px;
  border-radius: 15px;
}

a {
  display: block;
  margin: 10px;
  color: #ffd700;
  text-decoration: none;
  font-weight: bold;
}

button {
  padding: 10px 15px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  background-color: #ff4d6d;
  color: white;
}

#countdown {
  margin-top: 15px;
  font-size: 18px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="card">
  <h1>💍 Wedding Invitation</h1>

  <p>We invite you to our wedding</p>
  <p>📅 Date: 5 May 2026</p>
  <p>⏰ Time: 10:00 AM</p>
  <p>📍 Venue: Tirumala</p>

  <h2 id="countdown"></h2>

  <a href="https://maps.google.com/?q=Tirumala" target="_blank">
    📍 View Location
  </a>

  <a href="https://forms.gle/aLQPT8MqcXdpXaHs7" target="_blank">
    ✅ RSVP Here
  </a>

  <button onclick="playMusic()">🎵 Play Music</button>
</div>

<!-- AUDIO -->
<audio id="myAudio" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<script>
// Countdown Timer
const weddingDate = new Date(2026, 4, 5, 10, 0, 0).getTime();

setInterval(() => {
  const now = new Date().getTime();
  const gap = weddingDate - now;

  if (gap <= 0) {
    document.getElementById("countdown").innerHTML = "🎉 Wedding Day!";
    return;
  }

  const days = Math.floor(gap / (1000 * 60 * 60 * 24));
  const hours = Math.floor((gap % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

  document.getElementById("countdown").innerHTML =
    "⏳ " + days + " days " + hours + " hours left 💍";
}, 1000);

// Play Music
function playMusic() {
  const audio = document.getElementById("myAudio");
  audio.play().catch(err => {
    alert("Click again to enable audio (browser restriction)");
    console.log(err);
  });
}
</script>

</body>
</html>
