<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Invitation</title>

<style>
body {
  font-family: Arial, sans-serif;
  background-image: url('da.jpeg');
  background-size: cover;
  background-position: center;
  color: white;
  text-align: center;
  margin: 0;
  padding: 0;
}

.card {
  background: rgba(0, 0, 0, 0.6);
  padding: 25px;
  margin: 80px auto;
  width: 320px;
  border-radius: 15px;
}

a {
  display: block;
  margin: 10px;
  color: #ffd700;
  text-decoration: none;
  font-weight: bold;
}

#countdown {
  margin-top: 15px;
  font-size: 18px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="card">
  <h1>💍 Polavaram Purushotham ❤️ Gali Hema Latha</h1>
  <p>We invite you to our wedding</p>
  <p>📅 Date: 5 May 2026</p>
  <p>📍 Venue: Tirumula</p>

  <h2 id="countdown"></h2>

  <a href="https://maps.google.com/?q=Tirumala" target="_blank">📍 View Location</a>

  <!-- FIXED RSVP -->
  <a href="https://forms.gle/aLQPT8MqcXdpXaHs7" target="_blank">
    ✅ RSVP Here
  </a>
</div>

<!-- Music -->
<iframe width="0" height="0" 
src="https://www.youtube.com/embed/asB1pfcyyCA?autoplay=1&loop=1" 
frameborder="0" allow="autoplay">
</iframe>

<!-- FIXED COUNTDOWN -->
<script>
var countDownDate = new Date(2026, 4, 5, 10, 0, 0).getTime();

var x = setInterval(function() {
  var now = new Date().getTime();
  var distance = countDownDate - now;

  var days = Math.floor(distance / (1000 * 60 * 60 * 24));
  var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

  document.getElementById("countdown").innerHTML =
    "⏳ " + days + " days " + hours + " hours left 💍";

  if (distance < 0) {
    clearInterval(x);
    document.getElementById("countdown").innerHTML = "🎉 Wedding Day!";
  }
}, 1000);
</script>

</body>
</html>
